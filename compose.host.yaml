# Standalone Linux host-network configuration; do not merge with compose.yaml.
services:
  remote:
    build: .
    image: pianoteq-remote:local
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: host
    environment:
      PTQ_MODE: real
      PTQ_API_HOST: ${PTQ_API_HOST:-127.0.0.1}
      PTQ_API_PORT: ${PTQ_API_PORT:-8787}
      PTQ_RPC_URL: ${PTQ_RPC_URL:-http://127.0.0.1:8081/jsonrpc}
      PTQ_RPC_TIMEOUT_MS: ${PTQ_RPC_TIMEOUT_MS:-4000}
